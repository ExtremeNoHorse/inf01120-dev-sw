name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build e Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Spotless (verificação de formatação)
        run: mvn -B spotless:check

      - name: Checkstyle (verificação de estilo)
        run: mvn -B checkstyle:check

      - name: SpotBugs (análise estática de bugs)
        run: mvn -B spotbugs:check

      - name: Testes e gate de cobertura
        run: mvn -B verify

      - name: Publicar relatório JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore
